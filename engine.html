<title>原野场景引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL scene. Title top-left, build-report drawer on the right (agent feedback), camera presets + time/wind in a bottom bar. Single deliberate glass-over-scene look. */
:root {
  --ink: #f4f1e2;
  --ink-dim: rgba(244, 241, 226, 0.66);
  --glass: rgba(14, 30, 28, 0.42);
  --glass-strong: rgba(12, 26, 24, 0.82);
  --line: rgba(244, 241, 226, 0.18);
  --gold: #ecd585;
  --ok: #9fd67a;
  --warn: #f0b55a;
  --err: #f07a62;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: #bcd9e6; color: var(--ink); font-family: var(--font-body); }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.title { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); pointer-events: none; text-shadow: 0 1px 14px rgba(20, 40, 30, 0.4); }
.title h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.6vw, 34px); letter-spacing: 0.16em; line-height: 1.15; }
.title p { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.06em; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); }

.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(880px, calc(100vw - 32px));
  border-radius: 14px; padding: 10px 12px;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
}
.cams { display: flex; gap: 6px; flex: 1 1 320px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.cams::-webkit-scrollbar { display: none; }
.chip {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
  font: inherit; font-size: 12px; letter-spacing: 0.06em; padding: 5px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--ink-dim); }
.chip[aria-pressed="true"] { color: var(--gold); border-color: rgba(236, 213, 133, 0.55); background: rgba(236, 213, 133, 0.12); }
.chip:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sliders { display: flex; gap: 14px; flex: 1 1 280px; min-width: 0; }
.sl { display: grid; gap: 2px; flex: 1; min-width: 0; }
.sl label { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.06em; display: flex; justify-content: space-between; }
.sl label b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--gold) var(--fill, 50%), var(--line) var(--fill, 50%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--gold); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 2px solid var(--gold); }
input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); border: 2px solid var(--gold); }
input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

.icon-btn {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
  appearance: none; color: var(--ink); font: inherit; font-size: 12px; letter-spacing: 0.08em;
  padding: 7px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }

.drawer {
  position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100vw - 32px));
  background: var(--glass-strong); border-radius: 14px; overflow: hidden;
  display: grid; grid-template-rows: auto 1fr;
}
.tabs { display: flex; gap: 4px; padding: 10px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--ink-dim); font: inherit; font-size: 12px; letter-spacing: 0.1em; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
.tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.pane { overflow: auto; padding: 14px 16px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.pane h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 13px; letter-spacing: 0.16em; color: var(--ink); }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.kv span { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.08em; }
.kv b { font-family: var(--font-mono); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ops { display: grid; gap: 2px; font-family: var(--font-mono); font-size: 11.5px; }
.op { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; }
.op:hover { background: rgba(244, 241, 226, 0.05); }
.op i { font-style: normal; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.op em { font-style: normal; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.op .note { grid-column: 2 / 4; color: var(--ink-dim); font-size: 10.5px; overflow-wrap: anywhere; }
.op.warn .name { color: var(--warn); } .op.err .name { color: var(--err); }
.msgs { display: grid; gap: 6px; font-size: 12px; }
.msgs p { margin: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.msgs p.warn { border-color: rgba(240, 181, 90, 0.5); } .msgs p.err { border-color: rgba(240, 122, 98, 0.6); }
.views { display: flex; gap: 6px; flex-wrap: wrap; }
.schema { display: grid; gap: 12px; }
.schema section { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.schema header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.schema code { font-family: var(--font-mono); font-size: 12px; color: var(--gold); }
.schema small { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
.schema p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink-dim); }
.schema dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11.5px; }
.schema dt { font-family: var(--font-mono); color: var(--ink); }
.schema dd { margin: 0; color: var(--ink-dim); overflow-wrap: anywhere; }
.lead { font-size: 12px; line-height: 1.7; color: var(--ink-dim); margin: 0; }
.lead code, .api code { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); }
.api { margin: 0; padding: 10px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.22); font-family: var(--font-mono); font-size: 11px; line-height: 1.7; overflow-x: auto; white-space: pre; color: var(--ink-dim); }

.loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#7fb0d8, #cfe4ea 60%, #8fbf55); transition: opacity 0.8s ease; }
.loading div { display: grid; gap: 10px; justify-items: center; }
.loading strong { font-family: var(--font-display); letter-spacing: 0.3em; font-size: 16px; font-weight: 500; }
.loading span { font-family: var(--font-mono); font-size: 11px; color: rgba(244, 241, 226, 0.85); letter-spacing: 0.04em; }
.loading.done { opacity: 0; pointer-events: none; }

@media (max-width: 640px) {
  .drawer { top: calc(60px + env(safe-area-inset-top, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .title p { max-width: 60vw; }
}
@media (prefers-reduced-motion: reduce) { .loading { transition: none; } }
</style>

<canvas id="scene" aria-label="地图三维场景"></canvas>

<div class="title">
  <h1 id="mapName">原野场景引擎</h1>
  <p id="mapMeta">运行 scene.js</p>
</div>

<button class="icon-btn glass" id="reportBtn" type="button" aria-expanded="false" aria-controls="drawer"><span class="dot" id="statusDot"></span>构建报告</button>

<aside class="drawer glass" id="drawer" hidden aria-label="构建报告与 API 参考">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabReport" aria-selected="true" aria-controls="paneReport">报告</button>
    <button type="button" role="tab" id="tabSchema" aria-selected="false" aria-controls="paneSchema">脚本 API</button>
    <button type="button" role="tab" id="tabApi" aria-selected="false" aria-controls="paneApi">控制台</button>
  </div>
  <div class="pane" id="paneReport" role="tabpanel" aria-labelledby="tabReport"></div>
  <div class="pane" id="paneSchema" role="tabpanel" aria-labelledby="tabSchema" hidden></div>
  <div class="pane" id="paneApi" role="tabpanel" aria-labelledby="tabApi" hidden></div>
</aside>

<div class="bar glass">
  <div class="cams" id="cams" role="group" aria-label="镜头"></div>
  <div class="sliders">
    <div class="sl"><label for="todInput">时刻 <b id="todOut">上午</b></label><input type="range" id="todInput" min="0" max="1" step="0.001" value="0.3"></div>
    <div class="sl"><label for="windInput">风力 <b id="windOut">0.50</b></label><input type="range" id="windInput" min="0" max="1" step="0.01" value="0.5"></div>
  </div>
</div>

<div class="loading" id="loading"><div><strong>正在构建地图</strong><span id="loadStage">准备</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function () {
'use strict';

/* =====================================================================
   OP SCHEMA — the contract an agent writes against.
   [type, default (undefined = required), description]
   ===================================================================== */
const XZ = 'xz', NUM = 'num', STR = 'str', PATH = 'path', OBJ = 'obj', RANGE = 'range', BOOL = 'bool', ARR = 'arr';
const SCHEMA = {
  noise:     { phase: 'terrain', desc: '叠加全局噪声起伏。fbm 以 0.5 为中心（有升有降），ridged/billow 只升不降。', params: {
    type: [STR, 'fbm', 'fbm | ridged | billow'], amp: [NUM, undefined, '振幅，米'], scale: [NUM, 0.01, '频率，1/米'],
    octaves: [NUM, 4, '倍频数 1–7'], seed: [NUM, 0, '种子'], warp: [NUM, 0, '域扭曲强度，米'],
    mask: [OBJ, null, '可选径向遮罩 {center:[x,z], inner, outer, invert}'] } },
  mountains: { phase: 'terrain', desc: '以原点为中心的环形山脉：inner 以内为 0，outer 以外满强度。style:"eroded" 用梯度衰减的侵蚀 fBm（主脊 + 分支沟谷，山体厚重）；"ridged" 为尖锐山脊。', params: {
    style: [STR, 'eroded', 'eroded | ridged'], ridges: [NUM, 0.25, '叠加尖脊的比例 0–1'],
    inner: [NUM, 200, '起山半径'], outer: [NUM, 420, '满高半径'], height: [NUM, 200, '山脊高度'], base: [NUM, 15, '底座抬升'],
    scale: [NUM, 0.004, '山脊频率'], warp: [NUM, 50, '域扭曲'], seed: [NUM, 0, '种子'] } },
  peak:      { phase: 'terrain', desc: '单座带棱线的山峰。', params: {
    x: [NUM, undefined, ''], z: [NUM, undefined, ''], radius: [NUM, undefined, '山脚半径'], height: [NUM, undefined, '峰高'],
    sharpness: [NUM, 1.5, '>1 更尖'], ridges: [NUM, 0.45, '棱线起伏 0–1'], seed: [NUM, 0, ''] } },
  hill:      { phase: 'terrain', desc: '加一个包或挖一个坑（height 为负）。', params: {
    x: [NUM, undefined, ''], z: [NUM, undefined, ''], radius: [NUM, undefined, ''], height: [NUM, undefined, '可为负'],
    shape: [STR, 'gauss', 'gauss | smooth | plateau'] } },
  flatten:   { phase: 'terrain', desc: '把区域向目标高度压平。', params: {
    x: [NUM, undefined, ''], z: [NUM, undefined, ''], radius: [NUM, undefined, '核心半径'], height: [NUM, undefined, '目标高度'],
    falloff: [NUM, 20, '过渡宽度'], strength: [NUM, 1, '0–1'] } },
  river:     { phase: 'terrain', desc: '沿路径挖单调下降的河床，并生成流动水面。路径从上游写到下游。', params: {
    path: [PATH, undefined, '[[x,z],…] 至少 2 点'], width: [NUM, 6, '河道宽'], depth: [NUM, 1.4, '河床深'],
    bank: [NUM, 6, '河岸坡宽'], drop: [NUM, 0.01, '每米最小落差'] } },
  smooth:    { phase: 'terrain', desc: '局部平滑细节网格。', params: {
    x: [NUM, 0, ''], z: [NUM, 0, ''], radius: [NUM, 80, ''], iterations: [NUM, 2, ''], strength: [NUM, 0.5, '0–1'] } },
  erode:     { phase: 'terrain', desc: '水滴式水力侵蚀，生成冲沟与沉积扇，同时写入磨损图供着色使用。', params: {
    grid: [STR, 'far', 'far | detail'], droplets: [NUM, 60000, '水滴数'], strength: [NUM, 1, '侵蚀倍率'],
    inertia: [NUM, 0.05, ''], capacity: [NUM, 4, ''], seed: [NUM, 0, ''] } },
  lake:      { phase: 'water', desc: '从种子点泛洪填湖。level 绝对水位；或 fill:"spill" 自动取溢出高度减 margin；或 fill:数值 = 种子地面 + 该值。', params: {
    x: [NUM, undefined, ''], z: [NUM, undefined, ''], level: [NUM, null, '绝对水位'], fill: [ARR, 'spill', '"spill" 或米数'],
    margin: [NUM, 0.4, 'spill 时低于溢出点的余量'], maxRadius: [NUM, 80, '泛洪最大半径'] } },
  scatter:   { phase: 'objects', desc: '按区域 + 规则散布模型。被规则拒绝的数量会写进报告。', params: {
    kind: [STR, undefined, '见模型库'], count: [NUM, 100, '目标数量'], area: [OBJ, { type: 'all' }, '{type:circle,center,radius} | {type:ring,center,inner,outer} | {type:rect,min,max} | {type:polygon,points} | {type:all}'],
    rules: [OBJ, {}, '{height, slope, waterDist, moisture, sun: [a,b]；noise:{scale,threshold,seed,invert}}。moisture 为汇流 + 近水湿度 0–1，sun 为坡向日照 0–1（0.5 是平地）'],
    cluster: [OBJ, null, '{size, radius}：成簇分布（Thomas 过程），size 为每簇平均数量'],
    scale: [RANGE, [0.85, 1.2], '缩放区间'], minSpacing: [NUM, null, '最小间距，默认取模型半径'], seed: [NUM, 0, ''] } },
  place:     { phase: 'objects', desc: '在指定点放一个模型（贴地）。', params: {
    kind: [STR, undefined, ''], x: [NUM, undefined, ''], z: [NUM, undefined, ''], scale: [NUM, 1, ''], rotation: [NUM, null, '弧度，缺省随机'], variant: [NUM, null, ''] } },
  grass:     { phase: 'grass', desc: '在圆形区域种草叶，中心密、边缘稀，自动避开水、陡坡和物件。', params: {
    center: [XZ, [0, 0], ''], radius: [NUM, 80, ''], density: [NUM, 1, '密度倍率'], rules: [OBJ, {}, '同 scatter.rules'] } },
  env:       { phase: 'env', desc: '环境：时刻、风、雾、雪线、配色。', params: {
    time: [NUM, 0.3, '0 清晨 · 0.5 正午 · 1 黄昏'], wind: [NUM, 0.5, '0–1'], windDir: [XZ, [0.86, -0.48], ''],
    fogDensity: [NUM, null, '覆盖时刻预设的雾'], snowLine: [NUM, 170, '雪线，米'], streaks: [BOOL, true, '风痕'], pollen: [BOOL, true, '飞絮'],
    grass: [OBJ, null, '{root,mid,tipA,tipB} 十六进制'], water: [OBJ, null, '{shallow,deep}'] } },
  camera:    { phase: 'env', desc: '镜头预设。用 at/look 贴地写（eye 为离地高度），或用 pos/target 绝对坐标。第一个为默认镜头。', params: {
    name: [STR, undefined, '只用字母数字，可作 #锚点'], label: [STR, null, '显示名'], at: [XZ, null, ''], eye: [NUM, 2.5, ''],
    look: [XZ, null, ''], lookEye: [NUM, 2, ''], pos: [ARR, null, '[x,y,z]'], target: [ARR, null, '[x,y,z]'] } }
};
const KIND_DOCS = {
  'tree.oak': '阔叶树，空间殖民算法生长枝干 + 叶片卡片，约 10m', 'tree.big': '大型孤树（同算法放大），约 16m，适合做地标', 'tree.pine': '针叶松，层叠针叶 + 叶簇卡片，8–14m，远处自动降级', 'tree.birch': '白桦，空间殖民生长，细高白干',
  'bush': '灌木团', 'flower.daisy': '雏菊（白瓣黄心）', 'flower.poppy': '虞美人（红色杯状）', 'flower.lupine': '羽扇豆（紫色花穗）',
  'flower.buttercup': '毛茛（小黄杯）', 'rock.boulder': '巨石：平面切割 + 岩层，顶面长苔', 'rock.cliff': '崖石露头，6–15m，适合放在陡坡上', 'rock.pebble': '卵石，适合河岸'
};
SCHEMA.thermal = { phase: 'terrain', desc: '热力侵蚀：坡度超过安息角的物质向下滑落，形成碎石坡和更敦实的山脚。建议放在水力侵蚀之后。', params: {
  grid: [STR, 'far', 'far | detail'], iterations: [NUM, 30, ''], talus: [NUM, 36, '安息角，度'], rate: [NUM, 0.5, '0–1'] } };
SCHEMA.apply = { phase: 'terrain', desc: '自定义逐格函数：对每个网格点调用 fn(x, z, h)，返回新高度。用来写台地、梯田、峡谷或任何笔刷。', params: {
  grid: [STR, 'both', 'both | detail | far'] } };
const SIGS = {
  noise: 't.noise({ amp, scale, type, octaves, seed, warp, mask })',
  mountains: 't.mountains({ inner, outer, height, base, scale, warp, seed, style, ridges })',
  peak: 't.peak(x, z, { radius, height, sharpness, ridges, seed })',
  hill: 't.hill(x, z, { radius, height, shape })   简写：t.raise(x, z, r, h) · t.lower(x, z, r, depth)',
  flatten: 't.flatten(x, z, { radius, height, falloff, strength })',
  smooth: 't.smooth(x, z, { radius, iterations, strength })',
  erode: 't.erode({ grid, droplets, strength, inertia, capacity, seed })',
  apply: 't.apply((x, z, h) => 新高度, { grid })',
  thermal: 't.thermal({ grid, iterations, talus, rate })',
  river: 'm.water.river(path, { width, depth, bank, drop })  → { length, drop, width, points(spacing) }',
  lake: 'm.water.lake(x, z, { level | fill, margin, maxRadius })  → { level, area, leaked } | null',
  scatter: 'm.scatter(kind, { count, area, rules, scale, minSpacing, cluster, seed })  → { placed, requested, rejected, positions }',
  place: 'm.place(kind, x, z, { scale, rotation, variant })  → { x, y, z }',
  grass: 'm.grass({ center, radius, density, rules })',
  env: 'm.env({ time, wind, windDir, fogDensity, snowLine, streaks, pollen, grass, water })',
  camera: 'm.camera(name, { label, at, eye, look, lookEye } | { label, pos, target })'
};
const CALL = { noise: 't.noise', mountains: 't.mountains', peak: 't.peak', hill: 't.hill', flatten: 't.flatten', smooth: 't.smooth', erode: 't.erode', apply: 't.apply', thermal: 't.thermal',
  river: 'm.water.river', lake: 'm.water.lake', scatter: 'm.scatter', place: 'm.place', grass: 'm.grass', env: 'm.env', camera: 'm.camera' };

/* ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('scene');
const isSmall = Math.min(innerWidth, innerHeight) < 640 || matchMedia('(pointer: coarse)').matches;

/* ------------------------- Agent API ------------------------- */
let paused = false;
window.mapEditor = {

  run: fn => build(fn),

/* ------------------------- Loop ------------------------- */
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); post.resize(); });
