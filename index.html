<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>原野场景引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="src/styles/main.css">
<!-- dev only: resolves bare imports to node_modules; tools/build.mjs bundles three.js and drops this map -->
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/examples/jsm/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="地图三维场景"></canvas>

<div class="title">
  <h1 id="mapName">原野场景引擎</h1>
  <p id="mapMeta">运行 scene.js</p>
</div>

<button class="icon-btn glass" id="reportBtn" type="button" aria-expanded="false" aria-controls="drawer"><span class="dot" id="statusDot"></span>构建报告</button>

<aside class="drawer glass" id="drawer" hidden aria-label="构建报告与 API 参考">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabReport" aria-selected="true" aria-controls="paneReport">报告</button>
    <button type="button" role="tab" id="tabSchema" aria-selected="false" aria-controls="paneSchema">脚本 API</button>
    <button type="button" role="tab" id="tabApi" aria-selected="false" aria-controls="paneApi">控制台</button>
  </div>
  <div class="pane" id="paneReport" role="tabpanel" aria-labelledby="tabReport"></div>
  <div class="pane" id="paneSchema" role="tabpanel" aria-labelledby="tabSchema" hidden></div>
  <div class="pane" id="paneApi" role="tabpanel" aria-labelledby="tabApi" hidden></div>
</aside>

<div class="bar glass">
  <div class="cams" id="cams" role="group" aria-label="镜头"></div>
  <div class="sliders">
    <div class="sl"><label for="todInput">时刻 <b id="todOut">上午</b></label><input type="range" id="todInput" min="0" max="1" step="0.001" value="0.3"></div>
    <div class="sl"><label for="windInput">风力 <b id="windOut">0.50</b></label><input type="range" id="windInput" min="0" max="1" step="0.01" value="0.5"></div>
  </div>
</div>

<div class="loading" id="loading"><div><strong>正在构建地图</strong><span id="loadStage">准备</span></div></div>

<!-- the scene script registers itself through defineScene(); the engine module runs after it -->
<script>window.defineScene = function (fn) { window.__scene = fn; };</script>
<script src="scene.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
